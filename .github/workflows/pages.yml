# Publishes the app to GitHub Pages.
#
# The site is public. Every push to main redeploys it, so main is what
# https://<owner>.github.io/song-tab/ is serving at any moment.
#
# Two settings this depends on, both outside the repository:
#   - Settings > Pages > Source: GitHub Actions.
#   - Settings > Environments > github-pages > Deployment branches must allow
#     main. That policy is pinned to whatever branch was default when Pages was
#     switched on, so renaming or changing the default branch silently breaks
#     deploys: the build passes and the deploy job fails in about a second with
#     no logs at all, because it never starts.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # A project site is served from /<repo>/, so the bundle and alphaTab's
      # font and SoundFont all have to resolve against that prefix.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # A single-page app needs every path to fall back to index.html, and
      # Pages has no rewrite rules - a copied 404.html is the usual trick.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
